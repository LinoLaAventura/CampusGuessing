<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WebSocket 对战测试</title>
<style>
body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
#log { background: #252526; border: 1px solid #3e3e42; padding: 15px; border-radius: 6px; height: 500px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; }
.log-info { color: #4ec9b0; }
.log-send { color: #569cd6; }
.log-recv { color: #ce9178; }
.log-error { color: #f44747; }
.log-success { color: #6a9955; }
button { margin: 5px; padding: 8px 16px; cursor: pointer; background: #0e639c; color: #fff; border: none; border-radius: 4px; }
button:hover { background: #1177bb; }
button:disabled { background: #555; cursor: not-allowed; }
input { background: #3c3c3c; color: #d4d4d4; border: 1px solid #3e3e42; padding: 6px 10px; border-radius: 4px; margin: 5px; }
.status { font-size: 14px; margin: 10px 0; }
.status.connected { color: #6a9955; }
.status.disconnected { color: #f44747; }
</style>
</head>
<body>
<h2>WebSocket 对战测试 (ws://localhost:8085/ws/battle)</h2>
<div class="status" id="status">状态: 未连接</div>
<div>
  <button onclick="connect()">连接</button>
  <button onclick="disconnect()">断开</button>
  <button onclick="clearLog()">清空日志</button>
</div>
<div style="margin:10px 0">
  <input id="wsin" placeholder="输入 JSON 消息..." style="width:400px" onkeydown="if(event.keyCode==13)sendMsg()">
  <button onclick="sendMsg()">发送</button>
</div>
<div style="margin:10px 0">
  <button onclick="testLogin()">1. 登录 testuser1</button>
  <button onclick="testLogin2()">1b. 登录 testuser2</button>
  <button onclick="testInvite()">2. 邀请对战</button>
  <button onclick="testAccept()">3. 接受邀请</button>
  <button onclick="testAnswer()">4. 提交答案</button>
  <button onclick="testNextRound()">5. 下一回合</button>
</div>
<div id="log"></div>

<script>
let ws = null;
let roomCode = null;

function log(msg, cls) {
  const div = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  div.innerHTML += `<div class="${cls || ''}">[${time}] ${msg}</div>`;
  div.scrollTop = div.scrollHeight;
}

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) { log('已连接', 'log-info'); return; }
  ws = new WebSocket('ws://localhost:8085/ws/battle');
  ws.onopen = () => {
    document.getElementById('status').innerHTML = '状态: <span class="connected">已连接</span>';
    log('WebSocket 连接成功', 'log-success');
  };
  ws.onmessage = (e) => {
    let data = e.data;
    try { data = JSON.stringify(JSON.parse(e.data), null, 2); } catch(x) {}
    log('收到: ' + data, 'log-recv');
    // 自动提取 roomCode
    try {
      const obj = JSON.parse(e.data);
      if (obj.roomCode) roomCode = obj.roomCode;
    } catch(x) {}
  };
  ws.onclose = () => {
    document.getElementById('status').innerHTML = '状态: <span class="disconnected">已断开</span>';
    log('WebSocket 断开', 'log-error');
  };
  ws.onerror = (e) => log('WebSocket 错误', 'log-error');
}

function disconnect() {
  if (ws) ws.close();
}

function sendMsg() {
  const input = document.getElementById('wsin');
  const text = input.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('未连接', 'log-error'); return; }
  ws.send(text);
  log('发送: ' + text, 'log-send');
  input.value = '';
}

function clearLog() { document.getElementById('log').innerHTML = ''; }

// 1. 登录 testuser1
function testLogin() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { connect(); setTimeout(() => testLogin(), 500); return; }
  ws.send(JSON.stringify({type: "login", username: "testuser1"}));
  log('发送: login testuser1', 'log-send');
}

// 1b. 登录 testuser2 (需要另一个浏览器窗口或标签页)
function testLogin2() {
  window.open(location.href, '_blank');
  log('请在新窗口中点击"连接"然后"登录 testuser2"', 'log-info');
}

// 2. 邀请对战
function testInvite() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('未连接', 'log-error'); return; }
  ws.send(JSON.stringify({type: "invite", inviter: "testuser1", invitee: "testuser2", gameType: "好友对战"}));
  log('发送: invite testuser1 -> testuser2', 'log-send');
}

// 3. 接受邀请
function testAccept() {
  if (!roomCode) { log('没有 roomCode，请先发送邀请', 'log-error'); return; }
  ws.send(JSON.stringify({type: "invite_response", roomCode: roomCode, accepted: true, username: "testuser2"}));
  log('发送: accept room=' + roomCode, 'log-send');
}

// 4. 提交答案
function testAnswer() {
  if (!roomCode) { log('没有 roomCode', 'log-error'); return; }
  ws.send(JSON.stringify({type: "answer", roomCode: roomCode, username: "testuser1", lon: 121.5, lat: 31.2}));
  log('发送: answer room=' + roomCode, 'log-send');
}

// 5. 下一回合
function testNextRound() {
  if (!roomCode) { log('没有 roomCode', 'log-error'); return; }
  ws.send(JSON.stringify({type: "next_round", roomCode: roomCode, username: "testuser1"}));
  log('发送: next_round room=' + roomCode, 'log-send');
}
</script>
</body>
</html>
