# ============================================================
# CampusGuessing 微服务 Nginx 集群配置
#
# 架构（微服务版）：
#   Nginx (80) → Gateway (8080) → 各微服务
#                 WebSocket 直连 → battle-service (8085)
#                 Redis (6379) 用于 WebSocket 状态共享
#
# 使用步骤：
# 1. 启动 Redis：redis-server
# 2. 启动各微服务 (user:8082, question:8083, social:8084, battle:8085, record:8086)
# 3. 启动 Gateway (8080)
# 4. 启动 Nginx：nginx -c nginx-cluster.conf
# 5. 前端：HTTP API 走 http://localhost/api/...，WebSocket 走 ws://localhost/ws/battle
# ============================================================

worker_processes  1;
error_log  logs/campus_error.log;
pid        logs/campus_nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream campus_gateway {
        # 微服务网关
        server localhost:8080 weight=1;
    }

    upstream campus_battle_ws {
        # battle-service WebSocket 直连（绕过 Gateway）
        least_conn;
        server localhost:8085;
    }

    server {
        listen 80;
        server_name localhost;

        access_log logs/campus_access.log;
        error_log  logs/campus_error.log;

        # ==================== HTTP API 代理（走 Gateway） ====================
        location /api/ {
            proxy_pass http://campus_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ==================== WebSocket 代理（直连 battle-service） ====================
        location /ws/ {
            proxy_pass http://campus_battle_ws;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # ==================== 静态资源（前端） ====================
        location / {
            root html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}