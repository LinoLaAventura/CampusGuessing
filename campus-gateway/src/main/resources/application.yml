server:
  port: 8080

spring:
  application:
    name: campus-gateway
  cloud:
    gateway:
      routes:
        # 用户服务
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**,/api/users/**
        # 题库服务
        - id: question-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/questions/**
        # 社交服务
        - id: social-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/friends/**,/api/comments/**
        # 记录服务
        - id: record-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/records/**
        # 对战服务（HTTP API）
        - id: battle-service-api
          uri: http://localhost:8085
          predicates:
            - Path=/api/battle/**
        # 对战服务（WebSocket）
        - id: battle-service-ws
          uri: http://localhost:8085
          predicates:
            - Path=/ws/battle/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG