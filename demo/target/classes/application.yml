server:
  port: 8080
  servlet:
    context-path: /api
  # 允许局域网访问 (0.0.0.0 监听所有网络接口)
  address: 0.0.0.0

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/campusguesssystem?useUnicode=true&characterEncoding=utf-8&useSSL=true
    username: root
    password: 134679*Abc
  # Redis 配置（在线状态、房间实时态缓存）
  data:
    redis:
      host: localhost
      port: 6379
      # password: 134679*Abc  # 本地 Redis 无密码
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# ==================== 部署模式 ====================
# broker.type: simple  → 单机 SimpleBroker（开发/单实例）
# broker.type: external → 外部 STOMP Broker（集群/多实例，需 RabbitMQ）
broker:
  type: simple
  relay-host: localhost
  relay-port: 61613
  relay-login: guest
  relay-passcode: guest

# online-user.store: redis → Redis 共享状态（集群/多实例）
# online-user.store: memory → 内存状态（单机回退）
online-user:
  store: redis

jwt:
  secret: 89a7b2f8-9c4d-4e8a-9f7b-8d6c7a89b0e189a7b2f8-9c4d-4e8a-9f7b-8d6c7a89b0e189a7b2f8-9c4d-4e8a-9f7b-8d6c7a89b0e1
  expiration: 86400000 # 24小时

logging:
  level:
    com.zsu.planfinder: DEBUG

