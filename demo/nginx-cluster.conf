# ============================================================
# CampusGuessing WebSocket 集群化 Nginx 配置
# 
# 部署架构：
#   Nginx (80) → 多实例 Spring Boot (8080, 8081, ...)
#                ↓
#         外部 STOMP Broker (RabbitMQ:61613)
#                ↓
#              Redis (6379)
#
# 使用步骤：
# 1. 启动 Redis：redis-server
# 2. 启动 STOMP Broker：docker run -d --name rabbitmq -p 5672:5672 -p 15672:15672 -p 61613:61613 rabbitmq:3-management
#    docker exec rabbitmq rabbitmq-plugins enable rabbitmq_stomp
# 3. 启动多个 Spring Boot 实例：
#    java -jar demo.jar --server.port=8080 --broker.type=external
#    java -jar demo.jar --server.port=8081 --broker.type=external
# 4. 启动 Nginx：nginx -c nginx-cluster.conf
# ============================================================

upstream campus_backend {
    # 负载均衡策略：ip_hash 确保同一客户端始终连接到同一后端
    # 注意：STOMP WebSocket 握手后客户端与后端维持长连接，不需要 sticky session
    # 但初始 HTTP 请求（如 /api/）可以用 ip_hash 保持一致性
    ip_hash;
    
    server localhost:8080 weight=1;
    server localhost:8081 weight=1;
    # 添加更多实例...
}

upstream campus_websocket {
    # WebSocket 使用 least_conn 策略，将新连接分配到连接数最少的实例
    least_conn;
    
    server localhost:8080;
    server localhost:8081;
    # 添加更多实例...
}

server {
    listen 80;
    server_name localhost;

    # 日志
    access_log logs/campus_access.log;
    error_log logs/campus_error.log;

    # ==================== HTTP API 代理 ====================
    location /api/ {
        proxy_pass http://campus_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ==================== WebSocket 代理 ====================
    location /api/ws-battle {
        proxy_pass http://campus_websocket;
        
        # WebSocket 必需的 Header
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接超时（建议比心跳间隔长）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # 禁用缓冲（WebSocket 需要实时传输）
        proxy_buffering off;
    }

    # ==================== SockJS 降级支持 ====================
    # SockJS 使用 HTTP 轮询作为降级方案，需要额外代理 /info 端点
    location /api/ws-battle/info {
        proxy_pass http://campus_websocket;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================================
# 验证清单：
# 1. 单实例模式：broker.type=simple，无需 Nginx，直接访问 localhost:8080
# 2. 集群模式：broker.type=external，启动 Nginx + RabbitMQ + 多实例
# 3. 验证 STOMP 连接：浏览器打开 battle-demo.html，连接 ws://localhost/api/ws-battle
# 4. 验证消息分发：两个用户分别连接不同实例，测试邀请/作答/结算
# ============================================================